<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全育盃賽程查詢</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0 0 60px;
      background-color: #f3f7fa;
      color: #162436;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    /* 頂部深藍橫幅 */
    .hero-banner {
      background: linear-gradient(125deg, #0b2538 0%, #103752 60%, #144463 100%);
      color: #ffffff;
      padding: 32px 24px 36px;
      border-bottom: 1px solid #1e4e6e;
    }
    .hero-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
    }
    .hero-kicker {
      font-size: 12px;
      letter-spacing: 2px;
      color: #93b4cc;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .hero-title {
      margin: 0 0 8px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .hero-subtitle {
      margin: 0;
      font-size: 14px;
      color: #b4cde0;
    }
    .date-pill {
      border: 1px solid rgba(168, 203, 228, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: #dcebf7;
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
    }

    /* 主內容區 */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 22px 24px 0;
    }

    /* 控制列 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .sport-tabs {
      display: inline-flex;
      background-color: #e4ebf1;
      padding: 5px;
      border-radius: 12px;
      gap: 4px;
    }
    .sport-tab {
      border: none;
      background: transparent;
      color: #4a5d70;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 20px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .sport-tab:hover {
      color: #156598;
    }
    .sport-tab.active {
      background-color: #ffffff;
      color: #16689c;
      box-shadow: 0 2px 6px rgba(15, 39, 64, 0.08);
    }

    .filter-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .filter-controls select,
    .filter-controls input {
      height: 40px;
      padding: 0 14px;
      border: 1px solid #d5dfe8;
      border-radius: 10px;
      background-color: #ffffff;
      color: #1c2e42;
      font-size: 14px;
      outline: none;
    }
    .filter-controls select:focus,
    .filter-controls input:focus {
      border-color: #16689c;
      box-shadow: 0 0 0 3px rgba(22, 104, 156, 0.12);
    }
    .filter-controls input {
      width: 220px;
    }

    /* 三張統計摘要卡 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 720px) {
      .kpi-grid {
        grid-template-columns: 1fr;
      }
    }
    .kpi-card {
      background: #ffffff;
      border: 1px solid #dce4ec;
      border-radius: 14px;
      padding: 18px 22px;
      box-shadow: 0 2px 8px rgba(16, 42, 67, 0.03);
    }
    .kpi-label {
      font-size: 13px;
      color: #6b7c8f;
      margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: #162436;
    }

    /* 白色卡片容器 */
    .panel-card {
      background: #ffffff;
      border: 1px solid #dce4ec;
      border-radius: 16px;
      padding: 22px 24px 24px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(16, 42, 67, 0.04);
    }
    .panel-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .panel-title {
      margin: 0 0 4px;
      font-size: 17px;
      font-weight: 700;
      color: #162436;
    }
    .panel-desc {
      margin: 0;
      font-size: 13px;
      color: #6b7c8f;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: #52657a;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.prelim { background-color: #1976a3; }
    .dot.final  { background-color: #d97336; }
    .dot.rest   { background-color: #9aa5b1; }

    /* 點擊時間軸區塊後展開的完整資訊卡 */
    .selected-detail {
      display: none;
      margin-top: 14px;
      padding: 14px 18px;
      border-radius: 12px;
      background-color: #f0f6fc;
      border: 1px solid #b9d5ee;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .selected-detail.show {
      display: flex;
    }
    .detail-meta {
      font-size: 13px;
      color: #3d5a78;
      margin-bottom: 4px;
    }
    .detail-title {
      font-size: 17px;
      font-weight: 700;
      color: #0d2847;
    }
    .detail-close {
      border: 1px solid #9ec2e3;
      background: #ffffff;
      color: #1256a8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .detail-close:hover {
      background: #e3effa;
    }

    #timeline-canvas-holder {
      width: 100%;
      overflow-x: auto;
    }
    #list-canvas-holder {
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="hero-banner">
    <div class="hero-inner">
      <div>
        <div class="hero-kicker">TAMKANG UNIVERSITY · EDUCATION CUP</div>
        <h1 class="hero-title">全育盃賽程查詢</h1>
        <p class="hero-subtitle">掌握每一場賽事，找到你想看的比賽。</p>
      </div>
      <div class="date-pill">比賽日期：12/5 - 12/6（羽球：12/5）</div>
    </div>
  </header>

  <main class="container">
    <!-- 篩選列 -->
    <section class="toolbar">
      <div class="sport-tabs" id="sport-tabs">
        <button type="button" class="sport-tab active" data-sport="籃球">籃球</button>
        <button type="button" class="sport-tab" data-sport="排球">排球</button>
        <button type="button" class="sport-tab" data-sport="羽球">羽球</button>
      </div>

      <div class="filter-controls">
        <select id="stage-select" aria-label="賽事階段篩選">
          <option value="ALL">全部賽事階段</option>
        </select>
        <select id="venue-select" aria-label="場地篩選">
          <option value="ALL">全部場地</option>
        </select>
        <input
          type="text"
          id="team-search"
          placeholder="搜尋隊伍名稱..."
          aria-label="搜尋隊伍名稱"
        />
      </div>
    </section>

    <!-- 三張摘要卡 -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">目前項目</div>
        <div class="kpi-value" id="kpi-sport">籃球</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">賽程筆數</div>
        <div class="kpi-value" id="kpi-count">0</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">使用場地</div>
        <div class="kpi-value" id="kpi-venues">0</div>
      </div>
    </section>

    <!-- 賽程時間軸（p5.js Canvas 1） -->
    <section class="panel-card">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">賽程時間軸</h2>
          <p class="panel-desc">橫向為時間，縱向為場地；區塊採簡潔顯示，點擊區塊即可查看完整資訊。</p>
        </div>
        <div class="legend">
          <span class="legend-item"><i class="dot prelim"></i>預賽</span>
          <span class="legend-item"><i class="dot final"></i>複賽 / 決賽</span>
          <span class="legend-item"><i class="dot rest"></i>休息 / 待定</span>
        </div>
      </div>

      <div id="timeline-canvas-holder"></div>

      <!-- 點擊後展開的完整資訊區 -->
      <div class="selected-detail" id="selected-detail">
        <div>
          <div class="detail-meta" id="detail-meta"></div>
          <div class="detail-title" id="detail-title"></div>
        </div>
        <button type="button" class="detail-close" id="detail-close">收合詳情</button>
      </div>
    </section>

    <!-- 完整賽程（p5.js Canvas 2） -->
    <section class="panel-card">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">完整賽程</h2>
          <p class="panel-desc">依賽事階段與開賽時間排序。</p>
        </div>
        <div class="panel-desc" id="list-counter">顯示 0 / 0 筆</div>
      </div>
      <div id="list-canvas-holder"></div>
    </section>
  </main>

  <script src="scheduleData.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
